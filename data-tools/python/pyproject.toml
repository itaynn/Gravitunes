[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gravitunes-data"
version = "0.1.0"
description = "Download NASA SVS Earth visualizations and decode them into NumPy value arrays"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.scripts]
gravitunes_data = "gravitunes_data.cli:main"

[tool.setuptools.packages.find]
include = ["gravitunes_data*"]
