[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gravitunes-sound"
version = "0.1.0"
description = "Python helper for the Gravitunes browser sound engine: build scores, stream live events."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
live = ["websockets>=12"]

[tool.setuptools]
packages = ["gravitunes_sound"]

[tool.setuptools.package-data]
gravitunes_sound = ["data/*.json"]
