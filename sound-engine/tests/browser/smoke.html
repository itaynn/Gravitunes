<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sound engine smoke test</title></head>
<body>
<h1>Sound engine smoke test</h1>
<p>Renders scores offline with the real engine and checks the audio. Open via a local server
(<code>python -m gravitunes_sound serve</code>, then <code>/tests/browser/smoke.html</code>).</p>
<pre id="out">running…</pre>
<script type="module">
import { renderScore, createEngine, PRESETS, encodeWav } from "../../js/index.js";

const results = [];
const check = (name, ok, info = "") => results.push(`${ok ? "PASS" : "FAIL"} ${name}${info ? " — " + info : ""}`);

function stats(buf, from = 0, to = buf.duration) {
  let sum = 0, peak = 0, n = 0;
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = Math.floor(from * buf.sampleRate); i < Math.min(d.length, to * buf.sampleRate); i++) {
      sum += d[i] * d[i]; peak = Math.max(peak, Math.abs(d[i])); n++;
    }
  }
  return { rms: Math.sqrt(sum / Math.max(1, n)), peak };
}
// Zero-crossing pitch estimate on the left channel.
function pitch(buf, from, to) {
  const d = buf.getChannelData(0), sr = buf.sampleRate;
  let crossings = 0;
  for (let i = Math.floor(from * sr) + 1; i < to * sr; i++) if (d[i - 1] <= 0 && d[i] > 0) crossings++;
  return crossings / (to - from);
}
// Largest sample-to-sample jump: a click detector.
function maxJump(buf) {
  let m = 0;
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = 1; i < d.length; i++) m = Math.max(m, Math.abs(d[i] - d[i - 1]));
  }
  return m;
}

async function run(name, fn) {
  try { await fn(); } catch (e) { check(name, false, `threw: ${e.message}`); }
}

await run("bare note sounds", async () => {
  const b = await renderScore({ version: 1, events: [{ t: 0, note: "A4", dur: 1 }] }, { tail: 1 });
  const s = stats(b, 0.1, 0.9);
  check("bare note sounds", s.rms > 0.01 && s.peak <= 1, `rms ${s.rms.toFixed(3)} peak ${s.peak.toFixed(3)}`);
  const f = pitch(b, 0.2, 0.8);
  check("A4 pitch ≈ 440 Hz", Math.abs(f - 440) < 5, `${f.toFixed(1)} Hz`);
});

await run("step 9 = A4 in 12tet", async () => {
  const b = await renderScore({ version: 1, tuning: "12tet", events: [{ t: 0, step: 9, dur: 1, voice: "sine" }] }, { tail: 0.5 });
  const f = pitch(b, 0.2, 0.8);
  check("step 9 = A4 in 12tet", Math.abs(f - 440) < 5, `${f.toFixed(1)} Hz`);
});

await run("value maps through scale", async () => {
  const b = await renderScore({ version: 1, scale: "major", events: [
    { t: 0, value: 0, range: [0, 1], dur: 0.5, voice: "sine" },
    { t: 0.6, value: 1, range: [0, 1], dur: 0.5, voice: "sine" }] }, { tail: 0.5 });
  const lo = pitch(b, 0.1, 0.45), hi = pitch(b, 0.7, 1.05);
  check("value maps through scale (higher value → higher pitch)", hi > lo * 1.2, `${lo.toFixed(0)} → ${hi.toFixed(0)} Hz`);
});

await run("glide", async () => {
  const b = await renderScore({ version: 1, events: [{ t: 0, freq: 220, dur: 2, voice: "sine", glide: { to: 440, time: 1 } }] }, { tail: 0.5 });
  const a = pitch(b, 0.05, 0.2), z = pitch(b, 1.3, 1.8);
  check("glide 220 → 440", Math.abs(a - 225) < 25 && Math.abs(z - 440) < 8, `${a.toFixed(0)} → ${z.toFixed(0)} Hz`);
});

await run("set/stop by id", async () => {
  // id and no dur: the note must hold past 1 s, follow the set, and end at the stop.
  const b = await renderScore({ version: 1, events: [
    { t: 0, id: "storm", freq: 330, amp: 0.8, voice: "organ" },
    { t: 1, type: "set", id: "storm", amp: 0.1 },
    { t: 3, type: "stop", id: "storm" }] }, { tail: 1.5 });
  const loud = stats(b, 0.5, 0.9).rms, quiet = stats(b, 1.4, 1.6).rms, late = stats(b, 2.5, 2.9).rms, after = stats(b, 3.5, 4).rms;
  check("id note without dur still sounds at t=1.5", quiet > 0.003, `rms ${quiet.toFixed(4)}`);
  check("set at t=1 lowers amplitude", quiet < loud * 0.4, `${loud.toFixed(3)} → ${quiet.toFixed(3)}`);
  check("id note holds until stop (t=2.5..2.9)", late > 0.003, `rms ${late.toFixed(4)}`);
  check("stop at t=3 silences note", after < 0.001, `rms after ${after.toFixed(5)}`);
});

await run("set before a scheduled dur release", async () => {
  const b = await renderScore({ version: 1, events: [
    { t: 0, id: "a", freq: 330, amp: 0.8, dur: 2, voice: "organ" },
    { t: 1, type: "set", id: "a", amp: 0.1 }] }, { tail: 1 });
  const loud = stats(b, 0.5, 0.9).rms, quiet = stats(b, 1.4, 1.8).rms, after = stats(b, 2.5, 3).rms;
  check("set works on a note whose dur release is still ahead", quiet < loud * 0.4 && quiet > 0.003, `${loud.toFixed(3)} → ${quiet.toFixed(4)}`);
  check("dur release still ends it", after < 0.001, `rms after ${after.toFixed(5)}`);
});

await run("explicit stop replaces a pending dur release", async () => {
  const b = await renderScore({ version: 1, events: [
    { t: 0, id: "long", freq: 330, dur: 3, voice: "organ" }, { t: 1, type: "stop", id: "long" },
    { t: 0, id: "short", freq: 500, dur: 1, voice: "sine" }, { t: 2, type: "stop", id: "short" }] }, { tail: 1 });
  const f = pitch(b, 1.4, 1.9);
  check("earlier stop cuts a longer dur", Math.abs(f - 500) < 6, `${f.toFixed(1)} Hz alone at 1.4..1.9`);
  check("later stop extends a shorter dur, then ends", stats(b, 1.4, 1.9).rms > 0.01 && stats(b, 2.5, 3).rms < 0.001);
});

await run("raga direction", async () => {
  // yaman: Pa (step 7, G4 392 Hz) only descending; ascending snaps to tivra Ma (step 6, 370 Hz).
  const ev = (t, value) => ({ t, value, dur: 0.6, voice: "sine" });
  const b = await renderScore({ version: 1, scale: "yaman", valueRange: [0, 24], events: [ev(0, 12), ev(0.8, 7), ev(1.6, 0), ev(2.4, 7)] }, { tail: 0.3 });
  const down = pitch(b, 0.9, 1.3), up = pitch(b, 2.5, 2.9);
  check("descending value phrase uses yaman's down-only Pa (≈392 Hz)", Math.abs(down - 392) < 5, `${down.toFixed(1)} Hz`);
  check("ascending to the same value uses tivra Ma (≈370 Hz)", Math.abs(up - 370) < 5, `${up.toFixed(1)} Hz`);
});

await run("stopAll resolves playScore ended", async () => {
  const ctx = new OfflineAudioContext({ numberOfChannels: 2, length: 44100, sampleRate: 44100 });
  const engine = createEngine({ context: ctx });
  const p = engine.playScore({ version: 1, events: [{ t: 0, id: "x", step: 0 }] }, { at: 0 });
  await p.ready;
  engine.stopAll();
  const r = await Promise.race([p.ended.then(() => "ended"), new Promise((res) => setTimeout(() => res("timeout"), 500))]);
  check("playScore().ended resolves after engine.stopAll()", r === "ended", r);
});

await run("12-step scale on 22-step tuning", async () => {
  let msg = "";
  try { await renderScore({ version: 1, tuning: "shruti22", scale: "major", events: [{ value: 0.5 }] }); } catch (e) { msg = e.message; }
  check("major on shruti22 is a clear error", /defined for 12-step tunings.*22 steps/.test(msg), msg);
});

for (const name of Object.keys(PRESETS)) {
  await run(`preset ${name}`, async () => {
    const b = await renderScore({ version: 1, events: [{ t: 0, note: "C4", dur: 0.8, voice: name }] }, { tail: 1 });
    const s = stats(b, 0, 1);
    check(`preset ${name} sounds without clipping`, s.rms > 0.003 && s.peak <= 1, `rms ${s.rms.toFixed(3)} peak ${s.peak.toFixed(3)}`);
  });
}

await run("dense data doesn't clip", async () => {
  const events = [];
  for (let i = 0; i < 200; i++) events.push({ t: (i % 50) * 0.02, step: i % 24, amp: 1, dur: 1, voice: "bright" });
  const b = await renderScore({ version: 1, events }, { tail: 1 });
  const s = stats(b);
  check("200 loud overlapping notes stay ≤ 1.0", s.peak <= 1.0, `peak ${s.peak.toFixed(3)}`);
});

await run("no clicks", async () => {
  const b = await renderScore({ version: 1, events: [
    { t: 0, freq: 300, dur: 0.3, voice: "sine", amp: 0.8 },
    { t: 0.5, freq: 500, dur: 0.3, voice: "sine", amp: 0.8 }] }, { tail: 0.5 });
  // A 500 Hz sine at amp ~0.8 moves at most ~2π·500/44100·0.8 ≈ 0.06 per sample; allow some headroom.
  const j = maxJump(b);
  check("no clicks at note start/end (sine voice)", j < 0.15, `max jump ${j.toFixed(3)}`);
});

await run("22-shruti tuning + raga", async () => {
  const b = await renderScore({ version: 1, tuning: "shruti22", scale: "yaman-22",
    events: [0, 0.25, 0.5, 0.75, 1].map((v, i) => ({ t: i * 0.3, value: v, dur: 0.25 })) }, { tail: 0.5 });
  check("22-shruti tuning + raga renders", stats(b).rms > 0.005);
});

await run("scl tuning", async () => {
  const scl = "! 19edo\n19-EDO\n19\n" + Array.from({ length: 19 }, (_, i) => ((i + 1) * 1200 / 19).toFixed(5)).join("\n") + "\n";
  const b = await renderScore({ version: 1, tuning: { scl }, events: [{ t: 0, step: 19, dur: 0.6, voice: "sine" }] }, { tail: 0.3 });
  const f = pitch(b, 0.1, 0.5);
  check("scl tuning: step 19 of 19-EDO = one octave above middle C", Math.abs(f - 523.25) < 6, `${f.toFixed(1)} Hz`);
});

await run("live engine API", async () => {
  const ctx = new OfflineAudioContext({ numberOfChannels: 2, length: 44100 * 2, sampleRate: 44100 });
  const engine = createEngine({ context: ctx });
  engine.voice("snow", { harmonics: [1, 0.3], envelope: { attack: 0.01, release: 0.2 } });
  const h = engine.play({ note: "C4", voice: "snow" });
  h.set({ amp: 0.2, pan: 0.5 }, 0.1);
  h.stop(1);
  let threw = "";
  try { engine.play({ voice: "snow" }); } catch (e) { threw = e.message; }
  check("play() without pitch throws a helpful error", /pitch|freq|note|step/i.test(threw), threw);
  try { engine.play({ note: "C4", voice: "nope" }); threw = ""; } catch (e) { threw = e.message; }
  check("unknown voice throws a helpful error", /nope/.test(threw), threw);
  const b = await ctx.startRendering();
  check("handle.stop ends note", stats(b, 0.2, 0.8).rms > 0.005 && stats(b, 1.5, 2).rms < 0.001);
});

await run("WAV encoding", async () => {
  const b = await renderScore({ version: 1, events: [{ t: 0, note: "C4", dur: 0.2 }] }, { tail: 0.1 });
  const w = new DataView(encodeWav(b));
  check("WAV header", w.getUint32(0) === 0x52494646 && w.getUint32(8) === 0x57415645);
});

const failed = results.filter((r) => r.startsWith("FAIL")).length;
document.getElementById("out").textContent = results.join("\n") + `\n\n${results.length - failed}/${results.length} passed`;
document.title = failed ? "FAIL" : "PASS";
console.log("SMOKE-RESULT\n" + document.getElementById("out").textContent);
</script>
</body>
</html>
