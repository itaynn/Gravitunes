<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal sound engine example</title>
</head>
<body>
<h1>Minimal example</h1>
<button type="button" id="go">Play three notes</button>
<p id="msg" role="status"></p>
<script type="module">
import { createEngine } from "../js/index.js";

const engine = createEngine();
document.getElementById("go").addEventListener("click", async () => {
  await engine.start(); // must run inside a user gesture
  // Defaults: sine voice, 12-TET. step 0 = middle C, so 0, 4, 7 is a C major chord.
  [0, 4, 7].forEach((step, i) => engine.play({ step, t: i * 0.3, dur: 0.8 }));
  document.getElementById("msg").textContent = "Playing.";
  console.log("EXAMPLE-OK minimal-js");
});
window.addEventListener("error", (e) => console.error("EXAMPLE-ERROR " + e.message));
</script>
</body>
</html>
