<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play a score file</title>
</head>
<body>
<h1>Play a score</h1>
<p>Loads <code>./storms.score.json</code> by default. Or pick your own score file.</p>
<p><label>Score file <input type="file" id="file" accept=".json,application/json"></label></p>
<p>
  <button type="button" id="play">Play</button>
  <button type="button" id="stop">Stop</button>
  <button type="button" id="wav">Download WAV</button>
</p>
<p id="msg" role="status">Loading...</p>
<script type="module">
import { createEngine, downloadWav } from "../js/index.js";

const engine = createEngine();
const msg = (s) => (document.getElementById("msg").textContent = s);
let score = null, playing = null;

async function load(text, name) {
  score = JSON.parse(text);
  msg(`Loaded ${name}: ${score.events.length} events.`);
}
async function loadDefault() {
  const r = await fetch("./storms.score.json");
  if (!r.ok) throw new Error(`could not fetch storms.score.json (${r.status}). Serve sound-engine/ over http, e.g. python -m gravitunes_sound serve.`);
  await load(await r.text(), "storms.score.json");
}
document.getElementById("file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (f) try { await load(await f.text(), f.name); } catch (err) { msg("Bad score file: " + err.message); }
});
document.getElementById("play").addEventListener("click", async () => {
  if (!score) return;
  await engine.start();
  playing?.stop();
  playing = engine.playScore(score);
  msg("Playing...");
  playing.ended.then(() => msg("Done."));
});
document.getElementById("stop").addEventListener("click", () => playing?.stop());
document.getElementById("wav").addEventListener("click", async () => {
  if (!score) return;
  msg("Rendering...");
  await downloadWav(score);
  msg("WAV downloaded.");
});
loadDefault().then(() => console.log("EXAMPLE-OK play-score " + score.events.length), (e) => { msg(e.message); console.error("EXAMPLE-ERROR " + e.message); });
window.addEventListener("error", (e) => console.error("EXAMPLE-ERROR " + e.message));
</script>
</body>
</html>
