<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gravitunes</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="core/style.css">
</head>
<body class="gt-mode">
  <a class="skip" href="#map">Skip to map</a>
  <nav id="gt-switcher" aria-label="Demos"><a href="./">All demos</a></nav>
  <header class="intro">
    <h1 id="mode-title">Loading...</h1>
    <p id="mode-desc"></p>
  </header>
  <main class="stage-wrap">
    <section class="stage" aria-labelledby="map-heading">
      <h2 id="map-heading" class="visually-hidden">Map</h2>
      <p id="dataset-title" class="visually-hidden"></p>
      <div class="mapbox">
        <canvas id="map-image" class="map-image" width="1024" height="512" aria-hidden="true"></canvas>
        <canvas id="map" width="1024" height="512" tabindex="0" role="application"
          aria-label="World map" aria-describedby="map-keys"></canvas>
        <img id="colorbar" alt="Color bar" class="colorbar">
        <p id="time-label" class="time-badge" aria-hidden="true"></p>
        <button id="zoom-reset" type="button" class="zoom-reset" hidden>Reset zoom</button>
      </div>
      <p id="map-keys" class="visually-hidden">Arrow keys move 5 degrees, Shift+arrow 1 degree, Alt+arrow 20 degrees, Home returns to 0,0, Enter plays and describes the spot. Plus and minus zoom in and out, 0 resets the zoom; the mouse wheel zooms and dragging pans. Mouse and touch work too.</p>
      <p id="status" role="status"></p>
    </section>
  </main>
  <div class="bar" role="group" aria-label="Controls">
    <div id="timeline" class="bar-time"></div>
    <button id="start-sound" type="button" class="primary" aria-pressed="false" aria-label="Sound off. Press to turn sound on">&#128263; Sound</button>
    <div id="dataset-picker" class="bar-item"></div>
    <div id="shared-controls" class="bar-item"></div>
    <button id="more-toggle" type="button" aria-expanded="false" aria-controls="drawer" aria-label="More controls">&#9776; More</button>
  </div>
  <aside id="drawer" class="drawer" aria-label="More controls" hidden>
    <div class="drawer-head"><h2 id="time-heading">More</h2>
      <button id="drawer-close" type="button" aria-label="Close more controls">&#10005;</button></div>
    <div id="mode-controls"></div>
    <div id="view-controls"></div>
  </aside>
  <div id="live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="core/host.js"></script>
</body>
</html>
