<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gravitunes</title>
  <link rel="stylesheet" href="core/style.css">
  <style>
    header { padding-top: 24px; padding-bottom: 8px; }
    header p { color: var(--muted); margin: 0; max-width: 60ch; }
    .modes { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin: 24px 0 48px; }
    .modes li.card { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 18px 20px;
      border: 1px solid #2c333d; border-radius: 10px; transition: border-color .15s, transform .15s; }
    .card:hover, .card:focus-within { border-color: var(--accent); transform: translateY(-2px); }
    .card h3 { margin: 0; font-size: 1.2rem; line-height: 1.3; }
    .card h3 a { color: var(--fg); text-decoration: none; }
    .card h3 a::after { content: ""; position: absolute; inset: 0; border-radius: 10px; } /* whole card is the link */
    .card h3 a:focus-visible { outline: none; }
    .card:focus-within { outline: 3px solid var(--accent); outline-offset: 3px; }
    .card .author { color: var(--muted); font-size: .9em; margin: 0; }
    .card .desc { margin: 0; flex: 1; }
    .card .tags { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; }
    .card .tags li { font-size: .8em; padding: 2px 8px; border-radius: 999px; background: #2b323b; color: var(--muted); }
    .card .links { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 4px 0 0; }
    .card .open { padding: .35em .9em; border-radius: 6px;
      background: var(--accent); color: #000; font-weight: 600; font-size: .95em; }
    .card .links a { position: relative; z-index: 1; color: var(--accent); } /* above the whole-card link */
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover, .card:focus-within { transform: none; } }
  </style>
</head>
<body>
  <header>
    <h1>Gravitunes</h1>
    <p>An Earth Information Jukebox: listen to NASA Earth visualizations. Pick a demo.</p>
  </header>
  <main>
    <h2 class="visually-hidden">Demos</h2>
    <ul id="modes" class="modes"><li>Loading demos...</li></ul>
  </main>
  <script type="module">
    const ul = document.getElementById('modes');
    const el = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    };
    try {
      const { orderModes, modeHref } = await import('./core/switcher.js');
      const { modes } = await (await fetch('modes/index.json')).json();
      ul.replaceChildren(...orderModes(modes).map((m) => {
        const li = el('li', 'card');
        const h = el('h3');
        const a = el('a', null, m.name);
        a.href = modeHref(m, new URL('./', location.href));
        h.append(a);
        li.append(h);
        if (m.author) li.append(el('p', 'author', `By ${m.author}`));
        // One or two sentences: the summary, else the description.
        if (m.summary || m.description) li.append(el('p', 'desc', m.summary || m.description));
        const ds = Array.isArray(m.datasets) ? m.datasets.map((d) => `SVS ${d}`) : m.datasets ? [`Datasets: ${m.datasets}`] : [];
        const tags = [...ds, ...(m.href ? ['Standalone page'] : [])];
        if (tags.length) {
          const tl = el('ul', 'tags');
          tl.setAttribute('aria-label', 'Details');
          tl.append(...tags.map((t) => el('li', null, t)));
          li.append(tl);
        }
        const links = el('p', 'links');
        const open = el('span', 'open', 'Open →');
        open.setAttribute('aria-hidden', 'true'); // the title link above is the accessible control
        // Offline single-file builds (python3 app/tools/build-standalone.py): light, and HD when one is built.
        const file = (name, text, label) => {
          const f = el('a', null, text);
          f.href = new URL(`../dist/${name}`, location.href).href;
          f.setAttribute('aria-label', `${label} ${m.name}`);
          return f;
        };
        links.append(open);
        links.append(file(`${m.id}.html`, 'Offline', 'Offline file:'));
        if (m.hd) links.append(file(`${m.id}-hd.html`, 'HD', 'High-resolution offline file:'));
        li.append(links);
        return li;
      }));
    } catch (e) {
      ul.innerHTML = '<li>Could not load the demo list (modes/index.json). Run: python3 app/tools/build-modes-index.py</li>';
    }
  </script>
</body>
</html>
