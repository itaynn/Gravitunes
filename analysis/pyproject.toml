[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gravitunes_analysis"
version = "0.1.0"
description = "Computer-vision analysis of Gravitunes dataset frames (optical flow, vortices, tracking)"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python-headless", "scipy"]

[tool.setuptools]
packages = ["gravitunes_analysis"]
